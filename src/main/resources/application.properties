spring.application.name=expense-tracker
server.port=7070
spring.jpa.open-in-view=false

# --- Database (override with environment variables in production) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expense_tracker}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# WARNING: The fallback value below is for LOCAL DEVELOPMENT ONLY.
# In production (spring.profiles.active=prod), the JWT_SECRET environment variable
# MUST be set to a securely generated secret (>= 32 characters).
# The application will refuse to start in the 'prod' profile if JWT_SECRET is unset
# or still holds the dev default — enforced by ProductionSecretValidator.
jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-must-be-at-least-32-chars}
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000

# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# --- Login brute-force protection ---
app.login.max-attempts=5
app.login.attempt-window-ms=600000
app.login.lock-duration-ms=900000
